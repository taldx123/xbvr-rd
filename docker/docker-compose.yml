# =============================================================
#  XBVR Stack – docker-compose.yml
#  All secrets/settings are read from the env file passed via --env-file.
# =============================================================

name: xbvr-stack

services:

  # -----------------------------------------------------------
  # MariaDB – database backend for XBVR
  # -----------------------------------------------------------
  mariadb:
    image: mariadb:lts
    container_name: xbvr-mariadb
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"          # root pwd is auto-generated (safer)
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_AUTO_UPGRADE: "1"                 # keeps healthcheck users/config in sync for existing datadirs
    volumes:
      - ../data/mariadb:/var/lib/mysql             # persistent DB files
      - ./mariadb/my.cnf:/etc/mysql/conf.d/xbvr.cnf:ro   # tuning config
    ports:
      - "${MARIADB_PORT}:3306"
    command: --sql_mode="NO_ENGINE_SUBSTITUTION"
    restart: unless-stopped
    networks:
      - xbvr-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping --host=127.0.0.1 --protocol=tcp --user=$$MARIADB_USER --password=$$MARIADB_PASSWORD --silent",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # -----------------------------------------------------------
  # Arp WebDAV Server
  # -----------------------------------------------------------
  arp-webdav:
    build: ./arp-webdav
    container_name: arp-webdav
    ports:
      - "172.17.0.1:8080:8080"
    volumes:
      - ~/work/projects/arp/scraped/authenticated_links.json:/app/authenticated_links.json:ro
    restart: unless-stopped
    networks:
      - xbvr-net

  # -----------------------------------------------------------
  # XBVR – main application
  # -----------------------------------------------------------
  xbvr:
    # image: ghcr.io/xbapps/xbvr:latest
    # image: ghcr.io/xbapps/xbvr:0.4.39
    image: ghcr.io/taldx123/xbvr:latest
    # image: xbvr:SNAPSHOT
    container_name: xbvr
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      # MariaDB connection string – credentials come from .env
      DATABASE_URL: "mysql://${MARIADB_USER}:${MARIADB_PASSWORD}@mariadb:3306/${MARIADB_DATABASE}?charset=utf8mb4&collation=utf8mb4_unicode_ci&parseTime=True&loc=Local"
      DB_CONNECTION_POOL_SIZE: "${DB_CONNECTION_POOL_SIZE}"
      CONCURRENT_SCRAPERS: "${CONCURRENT_SCRAPERS}"
      DEBUG: true
      # GIN_MODE: debug
      # DATABASE_DEBUG: true
    ports:
      - "${XBVR_PORT}:9999"
    volumes:
      - realdebrid:/videos/realdebrid             # Real-Debrid mount via rclone plugin
      - arp:/videos/arp                           # Arp virtual mount
      - gdrive:/videos/gdrive                     # Google Drive mount via rclone plugin
      - ../data/xbvr:/root/.config/xbvr           # XBVR config & metadata
    restart: unless-stopped
    networks:
      - xbvr-net
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import http.client, sys; conn = http.client.HTTPConnection('127.0.0.1', 9999, timeout=5); conn.request('GET', '/api.json'); res = conn.getresponse(); sys.exit(0 if 200 <= res.status < 400 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

# ---------------------------------------------------------------
# Networks
# ---------------------------------------------------------------
networks:
  xbvr-net:
    driver: bridge

# ---------------------------------------------------------------
# Volumes
# "realdebrid" is managed by docker-compose with the rclone driver.
# It will be created when the stack starts and removed when stopped with "-v" flag.
# Deploy sequence: 
#   1. Run the Linux helper -> option 2 to install the rclone plugin
#   2. Run option 3 to start the stack (compose will create the volume)
# ---------------------------------------------------------------
volumes:
  realdebrid:
    driver: rclone
    driver_opts:
      type: "realdebrid"
      realdebrid-api_key: "${RD_API_KEY}"
      realdebrid-torrent_name_format: "name_id"
      allow_other: "true"
      dir_cache_time: "1h"
      poll_interval: "1m"
      vfs_cache_mode: "full"
      vfs_read_chunk_size: "32M"
      vfs_read_chunk_size_limit: "2G"
      vfs_read_ahead: "256M"
      vfs_cache_max_size: "150G"
      vfs_cache_max_age: "1h"

  arp:
    driver: rclone
    driver_opts:
      type: "webdav"
      webdav-url: "http://172.17.0.1:8080/"
      allow_other: "true"
      dir_cache_time: "1m"
      vfs_cache_mode: "full"
      vfs_read_chunk_size: "32M"
      vfs_read_chunk_size_limit: "2G"
      vfs_read_ahead: "256M"
      vfs_cache_max_size: "40G"
      vfs_cache_max_age: "1h"

  gdrive:
    driver: rclone
    driver_opts:
      remote: "gdrive:"
      allow_other: "true"
      dir_cache_time: "1000h"
      poll_interval: "1m"
      vfs_cache_mode: "full"
      vfs_read_chunk_size: "32M"
      vfs_read_chunk_size_limit: "2G"
      vfs_read_ahead: "256M"
      vfs_cache_max_size: "40G"
      vfs_cache_max_age: "1h"
